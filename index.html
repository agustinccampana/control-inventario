<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Stock</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        #estado { font-weight: bold; text-align: center; margin-bottom: 15px; color: #28a745; font-size: 22px; }
        #reader { width: 100%; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .botones { display: flex; gap: 10px; margin-bottom: 20px; }
        button { padding: 10px 15px; font-size: 16px; color: white; border: none; border-radius: 5px; width: 100%; cursor: pointer; }
        .btn-excel { background: #28a745; }
        .btn-borrar { background: #dc3545; }
    </style>
</head>
<body>
    <h2>Escáner de Inventario</h2>
    <div id="estado">Listo para escanear</div>
    <div id="reader"></div>
    
    <div class="botones">
        <button class="btn-borrar" onclick="borrarUltimaLectura()">Borrar última lectura</button>
        <button class="btn-excel" onclick="exportarExcel()">Exportar a Excel</button>
    </div>
    
    <table id="tablaStock">
        <thead>
            <tr>
                <th>Código de Barras</th>
                <th>Cantidad</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
        </tbody>
    </table>

    <script>
        const inventario = {};
        const historialLecturas = [];
        let escaneoPausado = false;
        let intervaloPausa;

        function onScanSuccess(decodedText, decodedResult) {
            if (escaneoPausado) return;

            historialLecturas.push(decodedText);
            if (inventario[decodedText]) {
                inventario[decodedText]++;
            } else {
                inventario[decodedText] = 1;
            }
            actualizarTabla();

            escaneoPausado = true;
            const estadoDiv = document.getElementById('estado');
            estadoDiv.style.color = "red";
            
            let segundosRestantes = 10;
            estadoDiv.innerText = `¡AGREGADO! Espera ${segundosRestantes}s...`;

            intervaloPausa = setInterval(() => {
                segundosRestantes--;
                if (segundosRestantes > 0) {
                    estadoDiv.innerText = `¡AGREGADO! Espera ${segundosRestantes}s...`;
                } else {
                    clearInterval(intervaloPausa);
                    escaneoPausado = false;
                    estadoDiv.style.color = "#28a745";
                    estadoDiv.innerText = "Listo para escanear";
                }
            }, 1000);
        }

        function borrarUltimaLectura() {
            if (historialLecturas.length === 0) {
                alert("No hay lecturas registradas para borrar.");
                return;
            }

            const ultimoCodigo = historialLecturas.pop();
            if (inventario[ultimoCodigo]) {
                inventario[ultimoCodigo]--;
                if (inventario[ultimoCodigo] <= 0) {
                    delete inventario[ultimoCodigo];
                }
            }
            actualizarTabla();

            clearInterval(intervaloPausa);
            escaneoPausado = false;
            const estadoDiv = document.getElementById('estado');
            estadoDiv.style.color = "#28a745";
            estadoDiv.innerText = "Listo para escanear";
        }

        function actualizarTabla() {
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = '';
            
            const inventarioOrdenado = Object.entries(inventario).sort((a, b) => {
                return historialLecturas.lastIndexOf(b[0]) - historialLecturas.lastIndexOf(a[0]);
            });

            for (const [codigo, cantidad] of inventarioOrdenado) {
                const fila = `<tr><td>${codigo}</td><td>${cantidad}</td></tr>`;
                tbody.innerHTML += fila;
            }
        }

        function exportarExcel() {
            const ws = XLSX.utils.json_to_sheet(
                Object.entries(inventario).map(([Codigo, Cantidad]) => ({ Codigo, Cantidad }))
            );
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Stock");
            XLSX.writeFile(wb, "Recuento_Stock.xlsx");
        }

        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: {width: 250, height: 100} }, false);
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
