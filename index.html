<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Stock</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        #reader { width: 100%; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        button { padding: 10px 15px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; width: 100%; }
    </style>
</head>
<body>
    <h2>Escáner de Inventario</h2>
    <div id="reader"></div>
    <button onclick="exportarExcel()" style="margin-bottom: 20px; background: #28a745;">Exportar a Excel</button>
    
    <table id="tablaStock">
        <thead>
            <tr>
                <th>Código de Barras</th>
                <th>Cantidad</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
        </tbody>
    </table>

    <script>
        const inventario = {};

        function onScanSuccess(decodedText, decodedResult) {
            if (inventario[decodedText]) {
                inventario[decodedText]++;
            } else {
                inventario[decodedText] = 1;
            }
            actualizarTabla();
        }

        function actualizarTabla() {
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = '';
            for (const [codigo, cantidad] of Object.entries(inventario)) {
                const fila = `<tr><td>${codigo}</td><td>${cantidad}</td></tr>`;
                tbody.innerHTML += fila;
            }
        }

        function exportarExcel() {
            const ws = XLSX.utils.json_to_sheet(
                Object.entries(inventario).map(([Codigo, Cantidad]) => ({ Codigo, Cantidad }))
            );
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Stock");
            XLSX.writeFile(wb, "Recuento_Stock.xlsx");
        }

        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: {width: 250, height: 100} }, false);
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
