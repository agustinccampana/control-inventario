<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Stock</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        #estado { font-weight: bold; text-align: center; margin-bottom: 15px; color: #28a745; font-size: 22px; }
        #reader { width: 100%; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .botones { display: flex; gap: 10px; margin-bottom: 20px; }
        button { padding: 10px 15px; font-size: 16px; color: white; border: none; border-radius: 5px; width: 100%; cursor: pointer; }
        .btn-excel { background: #28a745; }
        .btn-borrar { background: #dc3545; }

        /* Estilos para el cuadro emergente integrado */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 85%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .modal-content h3 { margin-top: 0; font-size: 18px; color: #333; }
        .modal-content input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin: 10px 0 15px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .modal-content button {
            background: #007bff;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            width: 100%;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h2>Escáner de Inventario</h2>
    <div id="estado">Listo para escanear</div>
    <div id="reader"></div>
    
    <div class="botones">
        <button class="btn-borrar" onclick="borrarUltimaLectura()">Borrar última lectura</button>
        <button class="btn-excel" onclick="exportarExcel()">Exportar a Excel</button>
    </div>
    
    <table id="tablaStock">
        <thead>
            <tr>
                <th>Código</th>
                <th>Producto</th>
                <th>Cantidad</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
        </tbody>
    </table>

    <!-- Ventana emergente en pantalla -->
    <div id="modalNombre" class="modal-overlay">
        <div class="modal-content">
            <h3>Nuevo código detectado</h3>
            <p style="margin: 5px 0; font-weight: bold; color: #555;" id="modalCodigoTexto"></p>
            <label for="inputNombre">Descripción del producto:</label>
            <input type="text" id="inputNombre" placeholder="Ej: Filtro de aceite" onkeydown="siEsEnterGuardar(event)">
            <button onclick="guardarNombre()">Guardar producto</button>
        </div>
    </div>

    <script>
        const inventario = {};
        const historialLecturas = [];
        let codigoEnProceso = null;
        let isProcessing = false;
        let intervaloPausa;

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            isProcessing = true;

            // Pausa física del escáner para evitar que siga leyendo fotogramas
            try { html5QrcodeScanner.pause(true); } catch(e) {}

            codigoEnProceso = decodedText;

            if (inventario[decodedText]) {
                inventario[decodedText].cantidad++;
                historialLecturas.push(decodedText);
                iniciarConteoRegresivo();
            } else {
                document.getElementById('modalCodigoTexto').innerText = `Código: ${decodedText}`;
                document.getElementById('inputNombre').value = '';
                document.getElementById('modalNombre').style.display = 'flex';
                setTimeout(() => document.getElementById('inputNombre').focus(), 150);
            }
        }

        function guardarNombre() {
            let nombreProducto = document.getElementById('inputNombre').value.trim();
            if (!nombreProducto) {
                nombreProducto = "Sin descripción";
            }

            inventario[codigoEnProceso] = {
                nombre: nombreProducto,
                cantidad: 1
            };
            historialLecturas.push(codigoEnProceso);

            document.getElementById('modalNombre').style.display = 'none';
            iniciarConteoRegresivo();
        }

        function siEsEnterGuardar(event) {
            if (event.key === "Enter") {
                guardarNombre();
            }
        }

        function iniciarConteoRegresivo() {
            actualizarTabla();
            const estadoDiv = document.getElementById('estado');
            estadoDiv.style.color = "red";
            
            let segundosRestantes = 5;
            estadoDiv.innerText = `¡AGREGADO! Espera ${segundosRestantes}s...`;

            intervaloPausa = setInterval(() => {
                segundosRestantes--;
                if (segundosRestantes > 0) {
                    estadoDiv.innerText = `¡AGREGADO! Espera ${segundosRestantes}s...`;
                } else {
                    clearInterval(intervaloPausa);
                    estadoDiv.style.color = "#28a745";
                    estadoDiv.innerText = "Listo para escanear";
                    isProcessing = false;
                    // Reanudar la lectura de la cámara
                    try { html5QrcodeScanner.resume(); } catch(e) {}
                }
            }, 1000);
        }

        function borrarUltimaLectura() {
            if (historialLecturas.length === 0) {
                alert("No hay lecturas registradas para borrar.");
                return;
            }

            const ultimoCodigo = historialLecturas.pop();
            if (inventario[ultimoCodigo]) {
                inventario[ultimoCodigo].cantidad--;
                if (inventario[ultimoCodigo].cantidad <= 0) {
                    delete inventario[ultimoCodigo];
                }
            }
            actualizarTabla();

            clearInterval(intervaloPausa);
            document.getElementById('modalNombre').style.display = 'none';
            isProcessing = false;
            
            const estadoDiv = document.getElementById('estado');
            estadoDiv.style.color = "#28a745";
            estadoDiv.innerText = "Listo para escanear";

            try { html5QrcodeScanner.resume(); } catch(e) {}
        }

        function actualizarTabla() {
            const tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = '';
            
            const inventarioOrdenado = Object.entries(inventario).sort((a, b) => {
                return historialLecturas.lastIndexOf(b[0]) - historialLecturas.lastIndexOf(a[0]);
            });

            for (const [codigo, datos] of inventarioOrdenado) {
                const fila = `<tr><td>${codigo}</td><td>${datos.nombre}</td><td>${datos.cantidad}</td></tr>`;
                tbody.innerHTML += fila;
            }
        }

        function exportarExcel() {
            const ws = XLSX.utils.json_to_sheet(
                Object.entries(inventario).map(([Codigo, datos]) => ({ 
                    Codigo: Codigo, 
                    Producto: datos.nombre,
                    Cantidad: datos.cantidad 
                }))
            );
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Stock");
            XLSX.writeFile(wb, "Recuento_Stock.xlsx");
        }

        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: {width: 250, height: 100} }, false);
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
